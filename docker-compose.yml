version: '3.8'

services:
  fastbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhangxiaonan1986/fastbox-tvbox:latest
    container_name: fastbox-tv
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8088
      - SEARCH_TIMEOUT=3.0
      - DEFAULT_HOME=douban
    volumes:
      - ./static:/app/static
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8088/health\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
