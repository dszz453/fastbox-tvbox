version: '3.8'

services:
  fastbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhangxiaonan1986/fastbox-tvbox:latest
    container_name: fastbox-tv
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8088

      # ============ 首页与体验 ============
      # douban(豆瓣热播首页) | lite(极速纯搜) | full(全能离线套件)
      - DEFAULT_HOME=douban
      - ENABLE_IMG_PROXY=true
      - ENABLE_DANMU=true

      # ============ 搜索性能 ============
      # 单源超时熔断(秒)：越小响应越快，推荐 2.5~3.5
      - SEARCH_TIMEOUT=3.0
      - MAX_CONCURRENCY=20
      - CACHE_TTL_SEARCH=1800
      - CACHE_TTL_DOUBAN=7200

      # ============ ① pansou-edge 网盘聚合搜索（可选） ============
      # 填写你自建的 pansou / pansou-edge 地址，留空则用内置公开节点。
      # 支持多个地址（英文逗号分隔），并行竞速、互为兜底，任一可用即不会搜不到。
      # 同机容器可写容器名，例如：http://pansou-app:80,https://xxx.workers.dev
      #
      # ⚠️ 注意：网页「系统设置」里保存的值优先级更高，会覆盖这里。
      #    若出现「网盘搜不到」，先去网页点一下「测试连接」排查。
      - ENABLE_PANSOU_EDGE=true
      - PANSOU_EDGE_URL=
      - PANSOU_EDGE_TOKEN=
      - PANSOU_EDGE_TIMEOUT=4.0

      # ============ ② PanCheck 网盘死链检测（可选） ============
      # 自建 PanCheck 服务地址，例如 http://192.168.1.10:8774
      # 检测模式: auto | remote | local | off
      - PANCHECK_MODE=auto
      - PANCHECK_URL=
      - PANCHECK_TIMEOUT=1.5
      - PANCHECK_BATCH_SIZE=30
      # 单次搜索最多探活多少条链接（0 = 不检测）。调大能过滤更多死链但会拖慢响应
      - PANCHECK_MAX_LINKS=30

      # ============ ③ 网盘播放密钥（可选，推荐用网页扫码配置） ============
      # 推荐打开网页 http://<IP>:8088 → 「网盘密钥」标签页扫码授权，
      # 无需在此填写。若想用环境变量预置，可取消下面的注释：
      # - ALI_OPEN_TOKEN=
      # - QUARK_COOKIE=
      # - UC_COOKIE=
      # - YD_AUTH=
      # - THUNDER_USERNAME=
      # - THUNDER_PASSWORD=
      # - PIKPAK_USERNAME=
      # - PIKPAK_PASSWORD=
      - VOD_FLAGS=4kz|auto

    volumes:
      # 静态资源（含 pg.jar 离线爬虫套件）—— 挂载后可随时替换升级
      - ./static:/app/static
      # 网页端保存的配置（pansou-edge / PanCheck / 性能参数）—— 必须挂载，否则重启丢失
      - ./data:/app/data

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
